services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-commerce_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-commerce_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-commerce_agent}
      OLLAMA_MODELS: ${OLLAMA_MODELS:-llama3.1:8b,gemma4:26b}
      PIPELINE_MODEL: ${PIPELINE_MODEL:-llama3.1:8b}
      WEB_SEARCH_MODEL: ${WEB_SEARCH_MODEL:-gemma4:26b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-commerce-agent}
      KAGGLE_DATASET_HANDLE: ${KAGGLE_DATASET_HANDLE:-lokeshparab/amazon-products-dataset}
      KAGGLE_NROWS: ${KAGGLE_NROWS:-50000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
